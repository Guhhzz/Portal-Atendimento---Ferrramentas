<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gere QR Codes para links, protocolos e textos curtos.">
  <title>Gerar QR Code | Portal de Ferramentas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="tool-page">
  <main class="main-content tool-main">
    <header class="page-header">
      <div>
        <span class="eyebrow">Atendimento &bull; Compartilhar</span>
        <h1>Gerar QR Code</h1>
      </div>
      <a class="back-link" href="../index.html">Voltar ao in&iacute;cio</a>
    </header>

    <section class="workspace-card qr-tool">
      <p class="tool-intro-copy">Crie um QR Code para links, protocolos, textos curtos ou orienta&ccedil;&otilde;es de atendimento.</p>

      <div class="field">
        <label for="qrText">Conte&uacute;do</label>
        <textarea id="qrText" class="transcript-output compact-textarea" rows="5" placeholder="Cole um link, protocolo ou texto curto."></textarea>
      </div>

      <div class="controls-grid">
        <div class="field">
          <label for="qrSize">Tamanho</label>
          <input id="qrSize" type="range" min="180" max="420" value="280">
          <small>Use tamanho maior para impress&atilde;o.</small>
        </div>
        <div class="field">
          <label for="qrMargin">Margem</label>
          <input id="qrMargin" type="range" min="0" max="4" value="2">
          <small>Margem ajuda na leitura por celular.</small>
        </div>
      </div>

      <div class="actions">
        <button class="button primary" id="generateButton" type="button">Gerar QR Code</button>
        <button class="button secondary" id="downloadButton" type="button" disabled>Baixar PNG</button>
        <button class="button danger" id="clearButton" type="button">Limpar</button>
      </div>

      <div class="qr-preview" id="qrPreview" aria-live="polite"></div>
      <div id="statusBox" class="status-slot" aria-live="polite"></div>
    </section>

    <aside class="cx-signature">
      <img src="../assets/logos/cx-customer-experience.svg" alt="Dados CX Customer Experience Gazin">
      <div>
        <strong>Dados CX</strong>
        <span>Ferramenta interna do N&uacute;cleo Customer Experience.</span>
      </div>
    </aside>
  </main>

  <script src="../js/file-utils.js"></script>
  <script src="../js/qr-generator.js"></script>
</body>
</html>
