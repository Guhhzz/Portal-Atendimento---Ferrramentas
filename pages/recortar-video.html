<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Recorte trechos de video diretamente no navegador.">
  <title>Recortar v&iacute;deo | Portal de Ferramentas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="tool-page">
  <main class="main-content tool-main">
    <header class="page-header">
      <div>
        <span class="eyebrow">Atendimento &bull; V&iacute;deo</span>
        <h1>Recortar v&iacute;deo</h1>
      </div>
      <a class="back-link" href="../index.html">Voltar ao in&iacute;cio</a>
    </header>

    <section class="workspace-card">
      <div class="tool-intro">
        <p>Escolha um v&iacute;deo, marque in&iacute;cio e fim, e gere um trecho em WEBM.</p>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-symbol" aria-hidden="true">&#8679;</div>
        <h2>Anexe o v&iacute;deo para recortar</h2>
        <p>O trecho ser&aacute; reproduzido e gravado localmente pelo navegador.</p>
        <label class="button secondary" for="fileInput">Selecionar v&iacute;deo</label>
        <input id="fileInput" type="file" accept="video/*">
      </div>

      <video id="videoPreview" class="video-preview media-preview" controls hidden></video>

      <div class="controls-grid compact-controls time-controls">
        <div class="field">
          <label for="startTime">In&iacute;cio em segundos</label>
          <input id="startTime" type="number" min="0" step="0.1" value="0">
        </div>

        <div class="field">
          <label for="endTime">Fim em segundos</label>
          <input id="endTime" type="number" min="0" step="0.1" value="0">
        </div>
      </div>

      <div class="actions">
        <button class="button primary" id="trimButton" type="button" disabled>Recortar e baixar</button>
        <button class="button secondary" id="clearButton" type="button">Limpar</button>
      </div>

      <div id="statusBox" class="status-slot" aria-live="polite"></div>
    </section>

    <aside class="cx-signature">
      <img src="../assets/logos/cx-customer-experience.svg" alt="Dados CX Customer Experience Gazin">
      <div>
        <strong>Dados CX</strong>
        <span>Ferramenta interna do N&uacute;cleo Customer Experience.</span>
      </div>
    </aside>
  </main>

  <script src="../js/file-utils.js"></script>
  <script src="../js/video-trimmer.js"></script>
</body>
</html>
