<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Una multiplos audios em um unico arquivo WAV diretamente no navegador.">
  <title>Unir &aacute;udios | Portal de Ferramentas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="tool-page">
  <main class="main-content tool-main">
    <header class="page-header">
      <div>
        <span class="eyebrow">Atendimento &bull; Voz</span>
        <h1>Unir &aacute;udios</h1>
      </div>
      <a class="back-link" href="../index.html">Voltar ao in&iacute;cio</a>
    </header>

    <section class="workspace-card">
      <div class="tool-intro">
        <p>Combine grava&ccedil;&otilde;es na ordem anexada e baixe um &uacute;nico arquivo WAV.</p>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-symbol" aria-hidden="true">&#8679;</div>
        <h2>Anexe dois ou mais &aacute;udios</h2>
        <p>Use MP3, WAV, OGG, M4A ou WEBM conforme suporte do navegador.</p>
        <label class="button secondary" for="fileInput">Selecionar &aacute;udios</label>
        <input id="fileInput" type="file" accept="audio/*" multiple>
      </div>

      <div id="fileList" class="file-list"></div>

      <div class="actions">
        <button class="button primary" id="joinButton" type="button" disabled>Unir e baixar WAV</button>
        <button class="button secondary" id="clearButton" type="button">Limpar</button>
      </div>

      <audio id="audioPreview" class="audio-preview" controls hidden></audio>
      <div id="statusBox" class="status-slot" aria-live="polite"></div>
    </section>

    <aside class="cx-signature">
      <img src="../assets/logos/cx-customer-experience.svg" alt="Dados CX Customer Experience Gazin">
      <div>
        <strong>Dados CX</strong>
        <span>Ferramenta interna do N&uacute;cleo Customer Experience.</span>
      </div>
    </aside>
  </main>

  <script src="../js/file-utils.js"></script>
  <script src="../js/audio-joiner.js"></script>
</body>
</html>
