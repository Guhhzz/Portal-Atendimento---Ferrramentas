<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Grave audio pelo microfone, ouca a previa e baixe o arquivo gerado pelo navegador.">
  <title>Gravador de &aacute;udio | Portal de Ferramentas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="main-content tool-main">
    <header class="page-header">
      <div>
        <span class="eyebrow">Atendimento &bull; Voz</span>
        <h1>Gravador de &aacute;udio</h1>
      </div>
      <a class="back-link" href="../index.html">&larr; Voltar ao in&iacute;cio</a>
    </header>

    <section class="workspace-card recorder">
      <div class="recorder-circle" id="recorderCircle" aria-hidden="true">&#9679;</div>
      <span class="eyebrow">Tempo de grava&ccedil;&atilde;o</span>
      <div class="timer" id="timer">00:00</div>

      <div class="actions">
        <button class="button primary" id="recordButton" type="button">Iniciar grava&ccedil;&atilde;o</button>
        <button class="button secondary" id="pauseButton" type="button" disabled>Pausar</button>
        <button class="button danger" id="stopButton" type="button" disabled>Finalizar</button>
      </div>

      <audio class="audio-preview" id="audioPreview" controls hidden></audio>

      <div class="actions">
        <button class="button primary" id="downloadButton" type="button" disabled>Baixar &aacute;udio</button>
        <button class="button secondary" id="deleteButton" type="button" disabled>Excluir e refazer</button>
      </div>

      <div id="statusBox" class="status-slot recorder-status" aria-live="polite"></div>

      <p class="help-text">Use para registrar orienta&ccedil;&otilde;es curtas, valida&ccedil;&otilde;es e explica&ccedil;&otilde;es de atendimento. O navegador define se o arquivo sai em WEBM ou OGG.</p>
    </section>

    <aside class="cx-signature">
      <img src="../assets/logos/cx-customer-experience.svg" alt="Dados CX Customer Experience Gazin">
      <div>
        <strong>Dados CX</strong>
        <span>Ferramenta interna do N&uacute;cleo Customer Experience.</span>
      </div>
    </aside>
  </main>

  <script src="../js/file-utils.js"></script>
  <script src="../js/audio-recorder.js"></script>
</body>
</html>
