<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Una videos em sequencia diretamente no navegador.">
  <title>Unir v&iacute;deos | Portal de Ferramentas</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="tool-page">
  <main class="main-content tool-main">
    <header class="page-header">
      <div>
        <span class="eyebrow">Atendimento &bull; V&iacute;deo</span>
        <h1>Unir v&iacute;deos</h1>
      </div>
      <a class="back-link" href="../index.html">Voltar ao in&iacute;cio</a>
    </header>

    <section class="workspace-card">
      <div class="tool-intro">
        <p>Organize v&iacute;deos na ordem desejada e gere uma grava&ccedil;&atilde;o final em WEBM.</p>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-symbol" aria-hidden="true">&#8679;</div>
        <h2>Anexe dois ou mais v&iacute;deos</h2>
        <p>A sa&iacute;da usa a resolu&ccedil;&atilde;o do primeiro v&iacute;deo como refer&ecirc;ncia.</p>
        <label class="button secondary" for="fileInput">Selecionar v&iacute;deos</label>
        <input id="fileInput" type="file" accept="video/*" multiple>
      </div>

      <div id="fileList" class="file-list"></div>
      <canvas id="mergeCanvas" class="video-preview media-preview" hidden></canvas>

      <div class="actions">
        <button class="button primary" id="mergeButton" type="button" disabled>Unir e baixar WEBM</button>
        <button class="button secondary" id="clearButton" type="button">Limpar</button>
      </div>

      <div id="statusBox" class="status-slot" aria-live="polite"></div>
    </section>

    <aside class="cx-signature">
      <img src="../assets/logos/cx-customer-experience.svg" alt="Dados CX Customer Experience Gazin">
      <div>
        <strong>Dados CX</strong>
        <span>Ferramenta interna do N&uacute;cleo Customer Experience.</span>
      </div>
    </aside>
  </main>

  <script src="../js/file-utils.js"></script>
  <script src="../js/video-joiner.js"></script>
</body>
</html>
